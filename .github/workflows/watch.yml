name: Roommatch watcher

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:                      # adds a "Run workflow" button

permissions:
  contents: write                         # lets it save roommatch_seen.json

concurrency:
  group: roommatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check Roommatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 roommatch_watcher.py

      - name: Remember what was already checked
        run: |
          if [ -n "$(git status --porcelain roommatch_seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add roommatch_seen.json
            git commit -m "Update checked listings"
            git push
          fi
